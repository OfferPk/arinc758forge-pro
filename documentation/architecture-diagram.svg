<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="55" y="60" fill="#06b6d4" font-size="22" font-weight="800" letter-spacing="-0.5">ARINC 758 COMMUNICATIONS MANAGEMENT UNIT (CMU / ATSU) ARCHITECTURE</text>
  <text x="55" y="80" fill="#94a3b8" font-size="12">Multi-Media Least-Cost Router (LCR), Automated OOOI State Machine, CPDLC / ACARS Stack &amp; ARINC 429 Bus</text>

  <!-- Left: Cockpit Interfaces & OOOI Sensors -->
  <rect x="30" y="115" width="280" height="495" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="115" width="280" height="38" rx="8" fill="#1e293b"/>
  <text x="50" y="140" fill="#f8fafc" font-size="14" font-weight="700">COCKPIT &amp; AIRFRAME INPUTS</text>

  <!-- MCDU ARINC 739A -->
  <rect x="50" y="170" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="195" fill="#38bdf8" font-size="12" font-weight="700">MCDU Interface (ARINC 739A)</text>
  <text x="65" y="215" fill="#94a3b8" font-size="11">• 14-Line x 24-Char Datalink Pages</text>
  <text x="65" y="235" fill="#94a3b8" font-size="11">• Interactive Line Select Keys (LSK)</text>
  <text x="65" y="250" fill="#34d399" font-size="10">CPDLC Clearances &amp; ACARS AOC Pages</text>

  <!-- OOOI Sensors -->
  <rect x="50" y="275" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="300" fill="#34d399" font-size="12" font-weight="700">Automated OOOI Sensor Feeds</text>
  <text x="65" y="320" fill="#94a3b8" font-size="11">• Door Proximity Sensors (OUT / IN)</text>
  <text x="65" y="340" fill="#94a3b8" font-size="11">• Weight-on-Wheels Squat Switch (OFF / ON)</text>
  <text x="65" y="355" fill="#38bdf8" font-size="10">Parking Brake Discrete Interlock</text>

  <!-- Flight Management System FMS -->
  <rect x="50" y="380" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="405" fill="#fbbf24" font-size="12" font-weight="700">FMS Cross-Link (ARINC 702)</text>
  <text x="65" y="425" fill="#94a3b8" font-size="11">• Active Route &amp; Flight Plan Winds</text>
  <text x="65" y="445" fill="#94a3b8" font-size="11">• Takeoff &amp; Landing Performance</text>
  <text x="65" y="460" fill="#94a3b8" font-size="10">Auto-Loading CPDLC Clearances to FMS</text>

  <!-- DLR Recorder Feed -->
  <rect x="50" y="485" width="240" height="105" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="510" fill="#c084fc" font-size="12" font-weight="700">Crash Recorder (ARINC 767 EAFR)</text>
  <text x="65" y="530" fill="#94a3b8" font-size="11">• Dedicated DLR Recording Bus</text>
  <text x="65" y="550" fill="#94a3b8" font-size="11">• Mandatory CPDLC/ACARS Audit Mirror</text>
  <text x="65" y="570" fill="#34d399" font-size="10">EUROCAE ED-112A Compliant Ingestion</text>

  <!-- Middle: Dual CMU Core & Least-Cost Router -->
  <rect x="340" y="115" width="320" height="495" rx="8" fill="url(#grad-card)" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="115" width="320" height="38" rx="8" fill="#0891b2"/>
  <text x="360" y="140" fill="#ffffff" font-size="14" font-weight="800">COMMUNICATIONS MANAGEMENT UNIT (4-MCU)</text>

  <rect x="360" y="170" width="280" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="195" fill="#10b981" font-size="13" font-weight="700">CMU 1 / ATSU (LEFT PRIMARY)</text>
  <text x="375" y="215" fill="#cbd5e1" font-size="11">• Primary ACARS &amp; ATN B1/B2 Protocol Engine</text>
  <text x="375" y="235" fill="#cbd5e1" font-size="11">• Dynamic Least-Cost Router (LCR) Master</text>
  <text x="375" y="255" fill="#cbd5e1" font-size="11">• Automated OOOI Event Generator (Label QP)</text>
  <text x="375" y="275" fill="#10b981" font-size="11" font-weight="600">STATUS: ONLINE ROUTING (SDI 1 / BUS A)</text>

  <rect x="360" y="305" width="280" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="330" fill="#94a3b8" font-size="13" font-weight="700">CMU 2 (RIGHT STANDBY)</text>
  <text x="375" y="350" fill="#94a3b8" font-size="11">• Dual-Redundant Standby Datalink Computer</text>
  <text x="375" y="370" fill="#94a3b8" font-size="11">• Mirror Database &amp; Cross-Talk Heartbeat</text>
  <text x="375" y="390" fill="#94a3b8" font-size="11">• Instant Zero-Message-Loss Bus Switchover</text>
  <text x="375" y="410" fill="#f59e0b" font-size="11" font-weight="600">STATUS: HOT STANDBY (SDI 2 / BUS B)</text>

  <!-- Dynamic LCR Subnetwork Router Core -->
  <rect x="360" y="440" width="280" height="150" rx="6" fill="#18202c" stroke="#06b6d4"/>
  <text x="375" y="465" fill="#38bdf8" font-size="13" font-weight="700">DYNAMIC LEAST-COST ROUTER (LCR)</text>
  <text x="375" y="485" fill="#cbd5e1" font-size="11">• 1. Gatelink (Cellular/Airport WiFi) — Free</text>
  <text x="375" y="505" fill="#cbd5e1" font-size="11">• 2. VHF VDL Mode 2 (ARINC 750) — Low Cost</text>
  <text x="375" y="525" fill="#cbd5e1" font-size="11">• 3. SATCOM Aero (ARINC 781) — Oceanic</text>
  <text x="375" y="545" fill="#cbd5e1" font-size="11">• 4. HF Datalink (ARINC 751) — Polar Backup</text>
  <text x="375" y="570" fill="#10b981" font-size="11" font-weight="700">ARINC 758 / DO-258A COMPLIANT</text>

  <!-- Right: Subnetwork Media & ARINC 429 Bus Words -->
  <rect x="690" y="115" width="280" height="495" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="690" y="115" width="280" height="38" rx="8" fill="#1e293b"/>
  <text x="710" y="140" fill="#f8fafc" font-size="14" font-weight="700">DATALINK MEDIA &amp; BUS WORDS</text>

  <!-- Subnetwork Links -->
  <rect x="710" y="170" width="240" height="155" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="725" y="195" fill="#38bdf8" font-size="12" font-weight="700">External Subnetwork Radios</text>
  <text x="725" y="215" fill="#94a3b8" font-size="11">• VHF 3 Radio: 136.975 MHz VDL Mode 2</text>
  <text x="725" y="235" fill="#94a3b8" font-size="11">• SATCOM SDU: Inmarsat / Iridium Link</text>
  <text x="725" y="255" fill="#94a3b8" font-size="11">• HFDL Transceiver: Global Skywave</text>
  <text x="725" y="275" fill="#94a3b8" font-size="11">• Gatelink Terminal: 802.11 / LTE Transceiver</text>
  <text x="725" y="300" fill="#34d399" font-size="10">Seamless Media Handover Architecture</text>

  <!-- ARINC 429 Bus Words -->
  <rect x="710" y="340" width="240" height="250" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="725" y="365" fill="#34d399" font-size="12" font-weight="700">ARINC 429 Digital Bus Words</text>
  <text x="725" y="385" fill="#94a3b8" font-size="11">• Label 304: CMU to Radio Tuning Cmd</text>
  <text x="725" y="405" fill="#94a3b8" font-size="11">• Label 305: Media Link Selection / Status</text>
  <text x="725" y="425" fill="#94a3b8" font-size="11">• Label 270: CMU Discrete Equipment Status</text>
  <text x="725" y="445" fill="#94a3b8" font-size="11">• Label 350: Maintenance BITE Word</text>
  <text x="725" y="470" fill="#06b6d4" font-size="11" font-weight="700">Bit 32 Odd Parity: Strictly Enforced</text>
  <text x="725" y="490" fill="#38bdf8" font-size="10">Destination: Radios, MCDU, FMS, EAFR</text>
  <text x="725" y="510" fill="#34d399" font-size="10">ATN B1 CPDLC &amp; ACARS Protocols</text>
  <text x="725" y="535" fill="#fbbf24" font-size="10">Automated OOOI Flight Leg Billing</text>
  <text x="725" y="560" fill="#10b981" font-size="11" font-weight="700">ARINC 758 CERTIFIED</text>
</svg>
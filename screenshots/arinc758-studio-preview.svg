<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect x="20" y="15" width="960" height="50" rx="6" fill="#0f141e" stroke="#1e293b"/>
  <text x="40" y="46" fill="#06b6d4" font-size="18" font-weight="700">ARINC758Forge Pro (v1.0.0) — CMU / ATSU Least-Cost Router Station</text>
  <rect x="760" y="26" width="200" height="28" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="775" y="45" fill="#10b981" font-size="11" font-weight="700">ARINC 758 / DO-280B PASS</text>

  <!-- Cockpit MCDU Screen Left Panel -->
  <rect x="20" y="80" width="370" height="500" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  
  <!-- CRT Screen (ARINC 739A 14x24) -->
  <rect x="40" y="105" width="330" height="270" rx="6" fill="#020617" stroke="#0f172a"/>
  <text x="55" y="130" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">   --- DATALINK COMM ---</text>
  <text x="55" y="148" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">FLIGHT: UAE123   TAIL:A6-EGO</text>
  <text x="55" y="166" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">ROUTE: OMDB -&gt; EGLL    </text>
  <text x="55" y="184" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">LINK : VHF_VDL2 OOOI:OFF</text>
  <text x="55" y="202" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">ATC  : EGGX (Shanwick) </text>
  <text x="55" y="220" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">------------------------</text>
  <text x="55" y="238" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;ATC CPDLC MENU        &gt;</text>
  <text x="55" y="256" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;COMPANY ACARS MSG     &gt;</text>
  <text x="55" y="274" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;FLIGHT PLAN WINDS     &gt;</text>
  <text x="55" y="292" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;TAKEOFF PERF DATA     &gt;</text>
  <text x="55" y="310" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;SUB-NETWORK STATUS    &gt;</text>
  <text x="55" y="328" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">&lt;WEATHER &amp; NOTAMS      &gt;</text>
  <text x="55" y="346" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">------------------------</text>
  <text x="55" y="364" fill="#34d399" font-family="'SF Mono', monospace" font-size="12">STATUS: CONNECTED (LCR) </text>

  <!-- OOOI State Buttons -->
  <text x="40" y="400" fill="#94a3b8" font-size="11" font-weight="600">AUTOMATED OOOI FLIGHT PHASE</text>
  <rect x="40" y="410" width="75" height="34" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="55" y="432" fill="#f8fafc" font-size="11" font-weight="700">OUT</text>

  <rect x="125" y="410" width="75" height="34" rx="3" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4"/>
  <text x="145" y="432" fill="#06b6d4" font-size="11" font-weight="700">OFF</text>

  <rect x="210" y="410" width="75" height="34" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="432" fill="#f8fafc" font-size="11" font-weight="700">ON</text>

  <rect x="295" y="410" width="75" height="34" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="432" fill="#f8fafc" font-size="11" font-weight="700">IN</text>

  <!-- CPDLC Response Buttons -->
  <text x="40" y="470" fill="#94a3b8" font-size="11" font-weight="600">CPDLC CLEARANCE RESPONSE</text>
  <rect x="40" y="480" width="100" height="34" rx="3" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <text x="68" y="502" fill="#34d399" font-size="11" font-weight="700">WILCO</text>

  <rect x="155" y="480" width="100" height="34" rx="3" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444"/>
  <text x="180" y="502" fill="#fca5a5" font-size="11" font-weight="700">UNABLE</text>

  <rect x="270" y="480" width="100" height="34" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="290" y="502" fill="#fbbf24" font-size="11" font-weight="700">STANDBY</text>

  <rect x="40" y="525" width="330" height="40" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="55" y="550" fill="#34d399" font-size="11" font-weight="700">CPDLC: "CLIMB TO AND MAINTAIN FL370" ACK</text>

  <!-- Right: LCR Subnetworks & 10-Point Auditor -->
  <rect x="410" y="80" width="570" height="235" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="430" y="110" fill="#06b6d4" font-size="13" font-weight="700">DYNAMIC LEAST-COST ROUTER (LCR) MEDIA STATUS</text>
  
  <rect x="430" y="125" width="260" height="50" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="440" y="145" fill="#f8fafc" font-size="11" font-weight="700">1. GATELINK ($0.00/MB)</text>
  <text x="440" y="162" fill="#94a3b8" font-size="10">Status: UNAVAILABLE (AIRBORNE)</text>

  <rect x="710" y="125" width="250" height="50" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4"/>
  <text x="720" y="145" fill="#06b6d4" font-size="11" font-weight="700">2. VHF VDL MODE 2 ($1.50/MB)</text>
  <text x="720" y="162" fill="#34d399" font-size="10">ACTIVE ROUTER (92% SIGNAL · 450ms)</text>

  <rect x="430" y="185" width="260" height="50" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="440" y="205" fill="#f8fafc" font-size="11" font-weight="700">3. SATCOM AERO ($12.00/MB)</text>
  <text x="440" y="222" fill="#fbbf24" font-size="10">HOT STANDBY (88% SIGNAL · Oceanic)</text>

  <rect x="710" y="185" width="250" height="50" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="720" y="205" fill="#f8fafc" font-size="11" font-weight="700">4. HF DATALINK ($4.50/MB)</text>
  <text x="720" y="222" fill="#94a3b8" font-size="10">HOT STANDBY (74% SIGNAL · Polar)</text>

  <rect x="430" y="245" width="530" height="55" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="440" y="265" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">Label 304  0xE5A5D523  Radio Tuning Command  Parity: ODD (PASS)</text>
  <text x="440" y="285" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">Label 305  0x601B85A3  Media Status: VHF VDL2 Parity: ODD (PASS)</text>

  <!-- Right Bottom: 10-Point Normative Auditor -->
  <rect x="410" y="335" width="570" height="245" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="430" y="365" fill="#10b981" font-size="13" font-weight="700">10-POINT NORMATIVE AUDITOR (10/10 PASSED - 100%)</text>

  <text x="430" y="395" fill="#cbd5e1" font-size="11">[PASSED] A758_01: Dual Redundant CMU / ATSU Router Architecture (SDI 1/2)</text>
  <text x="430" y="420" fill="#cbd5e1" font-size="11">[PASSED] A758_02: ARINC 429 Bit 32 Odd Parity Rule on Tuning &amp; Status Words</text>
  <text x="430" y="445" fill="#cbd5e1" font-size="11">[PASSED] A758_03: Multi-Subnetwork Dynamic Least-Cost Router (LCR) Handover</text>
  <text x="430" y="470" fill="#cbd5e1" font-size="11">[PASSED] A758_04: Automated OOOI Flight Phase Event State Machine &amp; Reporting</text>
  <text x="430" y="495" fill="#cbd5e1" font-size="11">[PASSED] A758_05: ATN Baseline 1 / FANS 1/A CPDLC Clearance Messaging</text>
  <text x="430" y="520" fill="#cbd5e1" font-size="11">[PASSED] A758_06: Automatic Dependent Surveillance - Contract (ADS-C) Reporting</text>
  <text x="430" y="545" fill="#cbd5e1" font-size="11">[PASSED] A758_07: ARINC 739A MCDU Interface &amp; 14x24 Screen Buffer Rendering</text>
</svg>